<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Volatility Chart + Volume Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8f4f8; --panel:#ffffff; --panel-2:#f8fafc;
    --border:#cbd5e1;
    --text:#1e293b; --text-hi:#0f172a;
    --muted:#64748b; --dim:#94a3b8;
    --up:#089981; --dn:#f23645;
    --accent:#3b82f6;
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font:13px/1.35 var(--sans);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;}
  body{display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;height:32px;box-shadow:0 1px 2px rgba(0,0,0,0.05);}
  .brand{font:700 12px/1 var(--sans);letter-spacing:-.2px;color:var(--text-hi);}
  .brand .accent{color:var(--accent)}
  .net{display:flex;align-items:center;gap:5px;margin-left:auto;font:600 10px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:background .25s;}
  .dot.live{background:var(--up);box-shadow:0 0 6px var(--up);}
  .dot.err{background:var(--dn);}
  .ctrl-strip{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
  .ctrl-strip::-webkit-scrollbar{display:none}
  select{
    background:var(--panel-2);color:var(--text);
    border:1px solid var(--border);border-radius:3px;
    padding:6px 10px;font:600 12px/1 var(--sans);outline:none;
    cursor:pointer;flex-shrink:0;height:32px;
    -webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%2364748b' d='M0 0l5 6 5-6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center;
    padding-right:24px;min-width:0;
  }
  #symbol-select{min-width:200px;max-width:240px;}
  #tf-select{min-width:64px;}
  #vp-mode-select{min-width:130px;}
  select:focus{border-color:var(--accent)}
  select:disabled{opacity:.6;cursor:wait;}
  .tabs{display:flex;margin-left:auto;gap:2px;background:var(--panel-2);border:1px solid var(--border);border-radius:3px;padding:2px;height:32px;flex-shrink:0;}
  .tab{padding:0 16px;font:700 10px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-radius:2px;display:flex;align-items:center;height:26px;}
  .tab.on{background:var(--accent);color:#fff;}
  .vp-toggle{padding:5px 12px;font:700 10px/1 var(--sans);letter-spacing:.5px;text-transform:uppercase;border-radius:3px;cursor:pointer;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);display:flex;align-items:center;gap:5px;flex-shrink:0;height:32px;transition:all .15s;user-select:none;}
  .vp-toggle.on{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:#2563eb;box-shadow:0 2px 8px rgba(59,130,246,.3);}
  .vp-toggle:active{transform:scale(.97);}
  .vp-panel{display:none;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--border);flex-shrink:0;gap:10px;align-items:center;flex-wrap:wrap;font:600 10px/1 var(--mono);}
  .vp-panel.show{display:flex;}
  .vp-panel label{display:flex;align-items:center;gap:4px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;}
  .vp-panel input[type=number]{width:52px;padding:4px 6px;border:1px solid var(--border);border-radius:3px;background:var(--panel);font:600 11px/1 var(--mono);text-align:center;outline:none;color:var(--text);}
  .vp-panel input[type=number]:focus{border-color:var(--accent);}
  .vp-panel input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;}
  #panes{flex:1;min-height:0;position:relative;background:var(--bg);overflow:hidden;}
  .pane{position:absolute;inset:0;display:none;}
  .pane.on{display:block;}
  #chart-wrap{position:relative;width:100%;height:100%;}
  #chart{width:100%;height:100%;}
  #vp-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3;}
  .pane-label{position:absolute;top:4px;left:8px;font:700 9px/1 var(--mono);color:var(--text-hi);letter-spacing:.8px;text-transform:uppercase;z-index:4;pointer-events:none;padding:3px 6px;background:rgba(255,255,255,.85);border-radius:2px;backdrop-filter:blur(4px);}
  #banner{display:none;padding:5px 10px;background:#d97706;color:#fff;font:700 10px/1 var(--mono);text-align:center;letter-spacing:.5px;text-transform:uppercase;flex-shrink:0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">VOLATILITY <span class="accent">CHART</span></div>
  <div class="net">
    <span class="dot" id="conn-dot"></span>
    <span id="conn-text">OFFLINE</span>
  </div>
</div>

<div class="ctrl-strip">
  <select id="symbol-select" disabled>
    <option value="">Loading symbols…</option>
  </select>
  <select id="tf-select"></select>
  <select id="vp-mode-select" title="Volume Profile Mode">
    <option value="visible">VP: Visible</option>
    <option value="session">VP: Session</option>
    <option value="fixed">VP: Fixed</option>
  </select>
  <div class="vp-toggle" id="vp-toggle">📊 VP OFF</div>
  <div class="tabs">
    <div class="tab on">Chart</div>
  </div>
</div>

<div class="vp-panel" id="vp-panel">
  <label>VA% <input type="number" id="vp-va" value="70" min="50" max="95" step="1"></label>
  <label>Rows <input type="number" id="vp-rows" value="24" min="8" max="80" step="1"></label>
  <label>Width <input type="number" id="vp-width" value="30" min="8" max="60" step="1"></label>
  <label><input type="checkbox" id="vp-show-poc" checked> POC</label>
  <label><input type="checkbox" id="vp-show-va" checked> VA</label>
  <label><input type="checkbox" id="vp-show-hvn" checked> HVN</label>
  <label><input type="checkbox" id="vp-show-lvn" checked> LVN</label>
</div>

<div id="banner">Connection lost — reconnecting…</div>

<div id="panes">
  <div class="pane on" id="pane-chart">
    <div id="chart-wrap">
      <div class="pane-label">PRICE · <span id="pane-symbol">—</span> · <span id="pane-tf">1m</span></div>
      <div id="chart"></div>
      <canvas id="vp-canvas"></canvas>
    </div>
  </div>
</div>

<script>
'use strict';

const WS_ENDPOINTS = [
  'wss://api.derivws.com/trading/v1/options/ws/public',
  'wss://ws.binaryws.com/websockets/v3?app_id=1089',
];
let endpointIndex = 0;

const MAX_CANDLES = 2000;
const CANDLE_COUNT = 1500;
const CANDLE_INITIAL_VIEW = 60;
const VOLATILITY_PATTERN = /^(R_\d+|1HZ\d+V)$/;

const TIMEFRAMES = [
  {sec:60,label:'1m'},{sec:120,label:'2m'},{sec:180,label:'3m'},
  {sec:300,label:'5m'},{sec:600,label:'10m'},{sec:900,label:'15m'},
  {sec:1800,label:'30m'},{sec:3600,label:'1h'},{sec:7200,label:'2h'},
  {sec:14400,label:'4h'},{sec:28800,label:'8h'},{sec:86400,label:'1d'},
];
const DEFAULT_TF = 60;

const CHART_CDNS = [
  'https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
  'https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
];

const STATE = {
  ws:null, connected:false, reconnecting:false,
  currentSymbol:'', currentGranularity:DEFAULT_TF,
  pipSize:2, candles:[],
  candleSubId:null, tickSubId:null,
  failCount:0, reconnectTimer:null, switching:false,
  firstLoadDone:false,
  availableSymbols: [],
  lastPrice: null,
  vpEnabled:false,
  vpMode:'visible',
  vpVA:70,
  vpRows:24,
  vpWidth:30,
  vpShowPOC:true,
  vpShowVA:true,
  vpShowHVN:true,
  vpShowLVN:true,
  vpFixedStart:null,
  vpResult:null,
};

let chart=null, candleSeries=null;
let vpCanvas=null, vpCtx=null;

/* ═══════════════════════════════════════════════════════════════
   CHART LIBRARY
═══════════════════════════════════════════════════════════════ */
function loadChartLibrary(){
  return new Promise((resolve,reject)=>{
    let idx=0;
    const tryNext=()=>{
      if(idx>=CHART_CDNS.length){reject(new Error('CDNs failed'));return;}
      const url=CHART_CDNS[idx++];
      const s=document.createElement('script');
      s.src=url;s.async=true;
      s.onload=()=>{if(typeof LightweightCharts!=='undefined')resolve(true);else tryNext();};
      s.onerror=()=>tryNext();
      document.head.appendChild(s);
    };
    tryNext();
  });
}

const BASE_OPTS = {
  layout:{ background:{color:'#f8fafc'}, textColor:'#475569', fontSize:10, fontFamily:'JetBrains Mono, monospace' },
  grid:{ vertLines:{color:'#e2e8f0'}, horzLines:{color:'#e2e8f0'} },
  handleScroll:true, handleScale:true,
};

const XHAIR = {
  mode:1,
  vertLine:{color:'#3b82f6',width:1,style:3,labelBackgroundColor:'#3b82f6'},
  horzLine:{color:'#3b82f6',width:1,style:3,labelBackgroundColor:'#3b82f6'},
};

function initChart(){
  if(typeof LightweightCharts==='undefined') return false;
  try{
    const el=document.getElementById('chart');
    chart=LightweightCharts.createChart(el,Object.assign({},BASE_OPTS,{
      crosshair:XHAIR,
      rightPriceScale:{borderColor:'#cbd5e1',autoScale:true,scaleMargins:{top:0.15,bottom:0.15}},
      timeScale:{borderColor:'#cbd5e1',timeVisible:true,secondsVisible:false,rightOffset:10,barSpacing:14,minBarSpacing:8},
    }));
    candleSeries=chart.addCandlestickSeries({
      upColor:'#089981',downColor:'#f23645',
      borderUpColor:'#089981',borderDownColor:'#f23645',
      wickUpColor:'#089981',wickDownColor:'#f23645',
      priceFormat:{type:'price',precision:STATE.pipSize,minMove:Math.pow(10,-STATE.pipSize)},
    });

    vpCanvas=document.getElementById('vp-canvas');
    vpCtx=vpCanvas.getContext('2d');

    chart.timeScale().subscribeVisibleLogicalRangeChange(()=>{
      if(STATE.vpEnabled) scheduleVPRedraw();
    });

    const ro=new ResizeObserver(()=>{
      if(!el.clientWidth||!el.clientHeight)return;
      try{chart.applyOptions({width:el.clientWidth,height:el.clientHeight});}catch(e){}
      resizeVPCanvas();
      if(STATE.vpEnabled) scheduleVPRedraw();
    });
    ro.observe(el);
    requestAnimationFrame(()=>{
      if(!el.clientWidth||!el.clientHeight)return;
      try{chart.applyOptions({width:el.clientWidth,height:el.clientHeight});}catch(e){}
      resizeVPCanvas();
    });
    return true;
  }catch(e){ console.error('[Chart init]',e); return false; }
}

/* ═══════════════════════════════════════════════════════════════
   WEBSOCKET
═══════════════════════════════════════════════════════════════ */
function connect(){
  if(STATE.ws && (STATE.ws.readyState===0||STATE.ws.readyState===1)) return;
  if(STATE.reconnectTimer){ clearTimeout(STATE.reconnectTimer); STATE.reconnectTimer=null; }
  setStatus('connecting');

  const url = WS_ENDPOINTS[endpointIndex];
  let ws;
  try{ ws=new WebSocket(url); }catch(e){
    scheduleReconnect(); return;
  }
  STATE.ws=ws;

  const openTimeout=setTimeout(()=>{
    if(ws.readyState!==1){ try{ws.close();}catch(e){} }
  },8000);

  ws.onopen=()=>{
    clearTimeout(openTimeout);
    STATE.connected=true; STATE.failCount=0;
    setStatus('live'); hideBanner();
    if(STATE.availableSymbols.length===0){
      send({ active_symbols:'brief' });
    } else if(STATE.currentSymbol){
      requestCandles(STATE.currentSymbol, STATE.currentGranularity);
      subscribeTicks(STATE.currentSymbol);
    }
  };

  ws.onmessage=(ev)=>{
    let d; try{ d=JSON.parse(ev.data); }catch(e){ return; }
    handleMessage(d);
  };

  ws.onclose=(e)=>{
    clearTimeout(openTimeout);
    STATE.connected=false; STATE.candleSubId=null; STATE.tickSubId=null;
    if(STATE.availableSymbols.length===0 && endpointIndex<WS_ENDPOINTS.length-1){
      endpointIndex++;
    }
    setStatus('error');
    scheduleReconnect();
  };
}

function scheduleReconnect(){
  if(STATE.reconnecting) return;
  STATE.reconnecting=true;
  showBanner();
  STATE.failCount++;
  const delay=Math.min(15000,1500*Math.pow(1.5,STATE.failCount-1))+Math.random()*800;
  STATE.reconnectTimer=setTimeout(()=>{ STATE.reconnecting=false; connect(); },delay);
}

function requestCandles(sym,gran){
  if(!isOpen()) return;
  send({ ticks_history:sym, style:'candles', granularity:gran, count:CANDLE_COUNT, end:'latest', subscribe:1 });
}
function subscribeTicks(sym){ if(!isOpen()) return; send({ ticks:sym, subscribe:1 }); }
function forgetAll(){
  if(!isOpen()) return;
  send({ forget_all:'candles' });
  send({ forget_all:'ticks' });
  STATE.candleSubId=null; STATE.tickSubId=null;
}

function handleMessage(d){
  switch(d.msg_type){
    case 'active_symbols': return onActiveSymbols(d);
    case 'candles':        return onCandles(d);
    case 'ohlc':           return onOhlc(d);
    case 'tick':           return onTick(d.tick);
  }
}

/* ═══════════════════════════════════════════════════════════════
   SYMBOL LOADING
═══════════════════════════════════════════════════════════════ */
function getSymbolCode(s){ return s.underlying_symbol || s.symbol || s.code || ''; }
function getSymbolName(s){ return s.display_name || s.underlying_symbol || s.symbol || ''; }

function onActiveSymbols(d){
  if(!d.active_symbols || !d.active_symbols.length) return;
  const volatilities = d.active_symbols.filter(s => VOLATILITY_PATTERN.test(getSymbolCode(s)));
  if(!volatilities.length) return;

  volatilities.sort((a,b)=>{
    const aCode=getSymbolCode(a), bCode=getSymbolCode(b);
    const aIs1s=aCode.startsWith('1HZ'), bIs1s=bCode.startsWith('1HZ');
    if(aIs1s!==bIs1s) return aIs1s ? 1 : -1;
    return aCode.localeCompare(bCode, undefined, { numeric:true });
  });

  STATE.availableSymbols=volatilities;
  populateSymbols();

  if(!STATE.currentSymbol){
    switchSymbol(getSymbolCode(volatilities[0]));
  }
}

function populateSymbols(){
  const sel=document.getElementById('symbol-select');
  sel.innerHTML = STATE.availableSymbols.map(s =>
    `<option value="${getSymbolCode(s)}">${getSymbolName(s)}</option>`
  ).join('');
  sel.disabled=false;

  const newSel=sel.cloneNode(true);
  sel.parentNode.replaceChild(newSel, sel);
  newSel.value=STATE.currentSymbol;
  newSel.addEventListener('change', ()=>{
    const sym=newSel.value;
    if(sym===STATE.currentSymbol && STATE.candles.length && !STATE.switching) return;
    switchSymbol(sym);
  });
}

/* ═══════════════════════════════════════════════════════════════
   TICK / CANDLE DATA
═══════════════════════════════════════════════════════════════ */
function onTick(t){
  if(!t) return;
  if(t.pip_size!=null && t.pip_size!==STATE.pipSize){
    STATE.pipSize=t.pip_size;
    try{
      candleSeries.applyOptions({priceFormat:{type:'price',precision:STATE.pipSize,minMove:Math.pow(10,-STATE.pipSize)}});
      chart.applyOptions({localization:{priceFormatter:v=>v.toFixed(STATE.pipSize)}});
    }catch(e){}
  }
  if(STATE.tickSubId===null && t.id) STATE.tickSubId=t.id;
  const price=parseFloat(t.quote);
  if(isFinite(price)) STATE.lastPrice=price;
}

function onCandles(d){
  if(!d.candles || !d.candles.length) return;
  if(!responseMatches(d)) return;
  if(d.subscription && d.subscription.id) STATE.candleSubId=d.subscription.id;

  const isInitial=d.candles.length>2;
  if(isInitial){
    STATE.candles=d.candles.map(c=>({
      time:c.epoch, open:parseFloat(c.open), high:parseFloat(c.high),
      low:parseFloat(c.low), close:parseFloat(c.close),
      volume: parseFloat(c.volume || 0),
    })).sort((a,b)=>a.time-b.time);
    if(STATE.candles.length>MAX_CANDLES) STATE.candles=STATE.candles.slice(-MAX_CANDLES);
    renderCandles(true);
    if(STATE.vpEnabled) scheduleVPRedraw();
    return;
  }
  const last=d.candles[d.candles.length-1];
  if(last) onOhlc({ ohlc:last, subscription:d.subscription, echo_req:d.echo_req });
}

function onOhlc(d){
  const o=d.ohlc; if(!o) return;
  if(d.echo_req && d.echo_req.ticks_history && d.echo_req.ticks_history!==STATE.currentSymbol) return;
  if(STATE.candleSubId===null && d.subscription && d.subscription.id) STATE.candleSubId=d.subscription.id;
  const candle={
    time:o.open_time, open:parseFloat(o.open), high:parseFloat(o.high),
    low:parseFloat(o.low), close:parseFloat(o.close),
    volume: parseFloat(o.volume || 0),
  };
  const last=STATE.candles[STATE.candles.length-1];
  if(last && last.time===candle.time) STATE.candles[STATE.candles.length-1]=candle;
  else { STATE.candles.push(candle); if(STATE.candles.length>MAX_CANDLES) STATE.candles.shift(); }
  if(candleSeries){ try{ candleSeries.update(candle); }catch(e){} }
  if(STATE.vpEnabled) scheduleVPRedraw();
}

function responseMatches(d){
  const sym=d.echo_req && d.echo_req.ticks_history;
  if(!sym) return true;
  return sym===STATE.currentSymbol;
}

/* ═══════════════════════════════════════════════════════════════
   SYMBOL / TIMEFRAME SWITCHING
═══════════════════════════════════════════════════════════════ */
function switchSymbol(sym){
  if(!sym) return;
  if(sym===STATE.currentSymbol && STATE.candles.length && !STATE.switching) return;

  STATE.switching=true;
  try{ candleSeries.setData([]); }catch(e){}

  STATE.currentSymbol=sym;
  STATE.candles=[];
  STATE.firstLoadDone=false;
  STATE.vpResult=null;
  document.getElementById('pane-symbol').textContent=sym;
  clearVPCanvas();

  forgetAll();
  setTimeout(()=>{
    if(isOpen()){
      requestCandles(sym, STATE.currentGranularity);
      subscribeTicks(sym);
    }
    STATE.switching=false;
  }, 350);
}

function switchTimeframe(gran){
  if(!isOpen()) return;
  if(gran===STATE.currentGranularity && STATE.candles.length && !STATE.switching) return;

  STATE.switching=true;
  try{ candleSeries.setData([]); }catch(e){}

  STATE.currentGranularity=gran;
  STATE.candles=[];
  STATE.firstLoadDone=false;
  STATE.vpResult=null;
  clearVPCanvas();
  const tf=TIMEFRAMES.find(t=>t.sec===gran);
  if(tf) document.getElementById('pane-tf').textContent=tf.label;

  if(isOpen()) send({ forget_all:'candles' });
  STATE.candleSubId=null;
  setTimeout(()=>{
    if(isOpen() && STATE.currentSymbol) requestCandles(STATE.currentSymbol, gran);
    STATE.switching=false;
  }, 350);
}

/* ═══════════════════════════════════════════════════════════════
   CANDLE RENDERING
═══════════════════════════════════════════════════════════════ */
function renderCandles(fresh){
  if(!candleSeries || !STATE.candles.length) return;
  try{
    candleSeries.setData(STATE.candles.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
    if(chart){
      if(fresh){
        try{ chart.priceScale('right').applyOptions({ autoScale:true, scaleMargins:{top:0.15,bottom:0.15} }); }catch(e){}
        if(!STATE.firstLoadDone){
          STATE.firstLoadDone=true;
          const total=STATE.candles.length;
          try{ chart.timeScale().setVisibleLogicalRange({ from:Math.max(0, total-CANDLE_INITIAL_VIEW), to:total+3 }); }catch(e){}
        }
      }
      requestAnimationFrame(()=>{ try{ chart.priceScale('right').applyOptions({ autoScale:true }); }catch(e){} });
    }
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════════
   VOLUME PROFILE ENGINE
═══════════════════════════════════════════════════════════════ */
function computeVolumeProfile(){
  const candles=STATE.candles;
  if(!candles.length) return null;

  let startIdx=0, endIdx=candles.length-1;
  const totalBars=candles.length;

  if(STATE.vpMode==='visible'){
    const range=chart.timeScale().getVisibleLogicalRange();
    if(!range) return null;
    startIdx=Math.max(0, Math.floor(range.from));
    endIdx=Math.min(totalBars-1, Math.ceil(range.to));
  } else if(STATE.vpMode==='session'){
    const lastTime=candles[totalBars-1].time;
    const lastDate=new Date(lastTime*1000);
    const sessionStartUTC=Date.UTC(lastDate.getUTCFullYear(), lastDate.getUTCMonth(), lastDate.getUTCDate())/1000;
    for(let i=totalBars-1; i>=0; i--){
      if(candles[i].time < sessionStartUTC){ startIdx=i+1; break; }
    }
    endIdx=totalBars-1;
  } else if(STATE.vpMode==='fixed'){
    if(STATE.vpFixedStart==null){
      startIdx=Math.max(0, totalBars-100);
    } else {
      for(let i=0; i<totalBars; i++){
        if(candles[i].time>=STATE.vpFixedStart){ startIdx=i; break; }
      }
    }
    endIdx=totalBars-1;
  }

  if(endIdx-startIdx<5) return null;

  let rHi=-Infinity, rLo=Infinity;
  for(let i=startIdx; i<=endIdx; i++){
    if(candles[i].high>rHi) rHi=candles[i].high;
    if(candles[i].low<rLo)  rLo=candles[i].low;
  }
  if(rHi<=rLo || !isFinite(rHi) || !isFinite(rLo)) return null;

  const rows=STATE.vpRows;
  const rowH=(rHi-rLo)/rows;
  if(rowH<=0) return null;

  const volArr=new Float64Array(rows);
  for(let i=startIdx; i<=endIdx; i++){
    const c=candles[i];
    const bH=c.high, bL=c.low;
    let bV=c.volume;
    if(!bV || bV<=0){
      bV = Math.max(1, Math.abs(bH-bL) / (rHi-rLo) * 50);
    }
    let sRow=Math.max(0, Math.floor((bL-rLo)/rowH));
    let eRow=Math.min(rows-1, Math.floor((bH-rLo)/rowH));
    if(eRow<sRow) eRow=sRow;
    const touched=eRow-sRow+1;
    const perRow=bV/touched;
    for(let r=sRow; r<=eRow; r++) volArr[r]+=perRow;
  }

  let totalVol=0, maxVol=0, pocRow=0;
  for(let r=0; r<rows; r++){
    totalVol+=volArr[r];
    if(volArr[r]>maxVol){ maxVol=volArr[r]; pocRow=r; }
  }
  if(totalVol<=0) return null;
  const avgVol=totalVol/rows;

  const target=totalVol*STATE.vpVA/100;
  let upRow=pocRow, loRow=pocRow, accVol=volArr[pocRow];
  while(accVol<target && (upRow<rows-1 || loRow>0)){
    const vAbove=upRow<rows-1 ? volArr[upRow+1] : -1;
    const vBelow=loRow>0      ? volArr[loRow-1] : -1;
    if(vAbove>=vBelow && vAbove>=0){ upRow++; accVol+=vAbove; }
    else if(vBelow>=0)              { loRow--; accVol+=vBelow; }
    else break;
  }

  const pocPrice=rLo+(pocRow+0.5)*rowH;
  const vahPrice=rLo+(upRow+1)*rowH;
  const valPrice=rLo+ loRow*rowH;

  const hvnThreshold=avgVol*1.5;
  const lvnThreshold=avgVol*0.4;

  return {
    rHi, rLo, rowH, rows, volArr, maxVol, avgVol, totalVol,
    pocRow, upRow, loRow,
    pocPrice, vahPrice, valPrice,
    startIdx, endIdx, bars:endIdx-startIdx+1,
    hvnThreshold, lvnThreshold,
  };
}

/* ═══════════════════════════════════════════════════════════════
   CANVAS RENDERING
═══════════════════════════════════════════════════════════════ */
function resizeVPCanvas(){
  if(!vpCanvas) return;
  const wrap=document.getElementById('chart-wrap');
  if(!wrap) return;
  const dpr=window.devicePixelRatio||1;
  vpCanvas.width=wrap.clientWidth*dpr;
  vpCanvas.height=wrap.clientHeight*dpr;
  vpCanvas.style.width=wrap.clientWidth+'px';
  vpCanvas.style.height=wrap.clientHeight+'px';
  vpCtx.setTransform(dpr,0,0,dpr,0,0);
}

function clearVPCanvas(){
  if(!vpCtx || !vpCanvas) return;
  vpCtx.clearRect(0,0,vpCanvas.width,vpCanvas.height);
}

let _vpRedrawScheduled=false;
function scheduleVPRedraw(){
  if(_vpRedrawScheduled) return;
  _vpRedrawScheduled=true;
  requestAnimationFrame(()=>{
    _vpRedrawScheduled=false;
    drawVolumeProfile();
  });
}

function drawVolumeProfile(){
  if(!STATE.vpEnabled || !vpCtx || !chart || !candleSeries){
    clearVPCanvas();
    return;
  }
  clearVPCanvas();

  const result=computeVolumeProfile();
  if(!result){ STATE.vpResult=null; return; }
  STATE.vpResult=result;

  const wrap=document.getElementById('chart-wrap');
  const chartW=wrap.clientWidth;
  const chartH=wrap.clientHeight;

  const priceScaleW=65;
  const drawRight=chartW - priceScaleW;
  const maxBarPx=(STATE.vpWidth/100)*chartW;
  const anchorX=drawRight;

  const {volArr, rows, maxVol, pocRow, upRow, loRow, hvnThreshold, lvnThreshold, rowH, rLo}=result;

  for(let r=0; r<rows; r++){
    const v=volArr[r];
    if(v<=0) continue;
    const priceTop=rLo+(r+1)*rowH;
    const priceBot=rLo+ r   *rowH;

    const yTop=candleSeries.priceToCoordinate(priceTop);
    const yBot=candleSeries.priceToCoordinate(priceBot);
    if(yTop==null || yBot==null) continue;
    if(yBot<0 || yTop>chartH) continue;

    const barH=Math.max(1, yBot-yTop-1);
    const wRatio=v/maxVol;
    const barW=Math.max(2, wRatio*maxBarPx);

    let fill='rgba(84,110,122,0.35)';
    let stroke='rgba(84,110,122,0.55)';

    const isVA=(r>=loRow && r<=upRow);
    const isPOC=(r===pocRow);
    const isHVN=STATE.vpShowHVN && v>=hvnThreshold;
    const isLVN=STATE.vpShowLVN && v<=lvnThreshold;

    if(isPOC){
      fill='rgba(242,54,69,0.75)';
      stroke='rgba(242,54,69,0.95)';
    } else if(isVA && STATE.vpShowVA){
      fill='rgba(59,130,246,0.35)';
      stroke='rgba(59,130,246,0.55)';
    } else if(isHVN){
      fill='rgba(8,153,129,0.55)';
      stroke='rgba(8,153,129,0.85)';
    } else if(isLVN){
      fill='rgba(217,119,6,0.45)';
      stroke='rgba(217,119,6,0.75)';
    }

    const x0=anchorX - barW;
    vpCtx.fillStyle=fill;
    vpCtx.fillRect(x0, yTop+0.5, barW, barH);
    vpCtx.strokeStyle=stroke;
    vpCtx.lineWidth=0.5;
    vpCtx.strokeRect(x0+0.25, yTop+0.75, barW-0.5, barH-0.5);
  }

  const lineLeft=anchorX - maxBarPx - 6;
  const lineRight=anchorX + 6;

  function drawLevel(price, colour, dashed, label){
    const y=candleSeries.priceToCoordinate(price);
    if(y==null || y<0 || y>chartH) return;
    vpCtx.strokeStyle=colour;
    vpCtx.lineWidth=1.5;
    if(dashed) vpCtx.setLineDash([5,4]); else vpCtx.setLineDash([]);
    vpCtx.beginPath();
    vpCtx.moveTo(lineLeft, y);
    vpCtx.lineTo(lineRight, y);
    vpCtx.stroke();
    vpCtx.setLineDash([]);

    if(label){
      vpCtx.font='600 10px "JetBrains Mono", monospace';
      const tw=vpCtx.measureText(label).width + 8;
      const th=14;
      const lx=lineLeft;
      const ly=y - th/2;
      vpCtx.fillStyle=colour;
      vpCtx.fillRect(lx, ly, tw, th);
      vpCtx.fillStyle='#ffffff';
      vpCtx.textBaseline='middle';
      vpCtx.textAlign='left';
      vpCtx.fillText(label, lx+4, y);
    }
  }

  if(STATE.vpShowPOC){
    drawLevel(result.pocPrice, 'rgba(242,54,69,0.95)', false,
      'POC  '+result.pocPrice.toFixed(STATE.pipSize));
  }
  if(STATE.vpShowVA){
    drawLevel(result.vahPrice, 'rgba(59,130,246,0.9)', true,
      'VAH  '+result.vahPrice.toFixed(STATE.pipSize));
    drawLevel(result.valPrice, 'rgba(59,130,246,0.9)', true,
      'VAL  '+result.valPrice.toFixed(STATE.pipSize));
  }

  vpCtx.font='600 9px "JetBrains Mono", monospace';
  const infoX=8, infoY=32;
  let vaVol=0;
  for(let r=loRow; r<=upRow; r++) vaVol+=volArr[r];
  const vaReal=(vaVol/result.totalVol*100).toFixed(1);
  const lines=[
    'VP · '+STATE.vpMode.toUpperCase(),
    'Bars  '+result.bars,
    'POC  '+result.pocPrice.toFixed(STATE.pipSize),
    'VAH  '+result.vahPrice.toFixed(STATE.pipSize),
    'VAL  '+result.valPrice.toFixed(STATE.pipSize),
    'VA  '+vaReal+'%   Ticks '+(result.totalVol>=1000? (result.totalVol/1000).toFixed(1)+'k' : Math.round(result.totalVol)),
  ];
  const boxW=125, lineH=13, boxH=lines.length*lineH+8;
  vpCtx.fillStyle='rgba(15,23,42,0.82)';
  vpCtx.fillRect(infoX, infoY, boxW, boxH);
  vpCtx.fillStyle='#f8fafc';
  vpCtx.textBaseline='top';
  vpCtx.textAlign='left';
  lines.forEach((ln, i)=>{
    vpCtx.fillText(ln, infoX+6, infoY+4+i*lineH);
  });
}

/* ═══════════════════════════════════════════════════════════════
   UI HELPERS
═══════════════════════════════════════════════════════════════ */
const $=id=>document.getElementById(id);
function setStatus(mode){
  const dot=$('conn-dot');
  dot.className='dot '+(mode==='live'?'live':mode==='error'?'err':'');
  $('conn-text').textContent=mode==='live'?'LIVE':mode==='error'?'OFFLINE':'CONNECTING';
}
function showBanner(){$('banner').style.display='block';}
function hideBanner(){$('banner').style.display='none';}
function isOpen(){ return STATE.ws && STATE.ws.readyState===1; }
function send(obj){ if(!isOpen()) return false; try{ STATE.ws.send(JSON.stringify(obj)); return true; }catch(e){ return false; } }

function populateTimeframes(){
  const sel=$('tf-select');
  sel.innerHTML=TIMEFRAMES.map(t=>`<option value="${t.sec}">${t.label}</option>`).join('');
  sel.value=String(DEFAULT_TF);
  sel.addEventListener('change', ()=>{
    const g=parseInt(sel.value,10);
    if(!isNaN(g)) switchTimeframe(g);
  });
}

function initVPControls(){
  const toggle=$('vp-toggle');
  const panel=$('vp-panel');
  const modeSel=$('vp-mode-select');

  toggle.addEventListener('click', ()=>{
    STATE.vpEnabled=!STATE.vpEnabled;
    toggle.classList.toggle('on', STATE.vpEnabled);
    toggle.textContent=STATE.vpEnabled ? '📊 VP ON' : '📊 VP OFF';
    panel.classList.toggle('show', STATE.vpEnabled);
    resizeVPCanvas();
    if(STATE.vpEnabled) scheduleVPRedraw();
    else clearVPCanvas();
  });

  modeSel.addEventListener('change', ()=>{
    STATE.vpMode=modeSel.value;
    if(STATE.vpMode==='fixed'){
      const r=chart.timeScale().getVisibleLogicalRange();
      if(r && STATE.candles.length){
        const from=Math.max(0, Math.floor(r.from));
        const to=Math.min(STATE.candles.length-1, Math.ceil(r.to));
        STATE.vpFixedStart=STATE.candles[from] ? STATE.candles[from].time : null;
      }
    }
    if(STATE.vpEnabled) scheduleVPRedraw();
  });

  $('vp-va').addEventListener('input', e=>{
    const v=parseFloat(e.target.value);
    if(!isNaN(v) && v>=50 && v<=95){ STATE.vpVA=v; if(STATE.vpEnabled) scheduleVPRedraw(); }
  });
  $('vp-rows').addEventListener('input', e=>{
    const v=parseInt(e.target.value,10);
    if(!isNaN(v) && v>=8 && v<=80){ STATE.vpRows=v; if(STATE.vpEnabled) scheduleVPRedraw(); }
  });
  $('vp-width').addEventListener('input', e=>{
    const v=parseInt(e.target.value,10);
    if(!isNaN(v) && v>=8 && v<=60){ STATE.vpWidth=v; if(STATE.vpEnabled) scheduleVPRedraw(); }
  });

  ['poc','va','hvn','lvn'].forEach(k=>{
    $('vp-show-'+k).addEventListener('change', e=>{
      const prop={
        'poc':'vpShowPOC', 'va':'vpShowVA', 'hvn':'vpShowHVN', 'lvn':'vpShowLVN'
      }[k];
      if(prop){ STATE[prop]=e.target.checked; if(STATE.vpEnabled) scheduleVPRedraw(); }
    });
  });
}

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
populateTimeframes();
initVPControls();

loadChartLibrary()
  .then(()=>{ initChart(); resizeVPCanvas(); })
  .catch((e)=>{ console.error('[Chart lib]', e); })
  .finally(()=>{ connect(); });

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    if(STATE.connected && !STATE.ws) connect();
    setTimeout(()=>{
      const el=document.getElementById('chart');
      if(chart && el && el.clientWidth && el.clientHeight){
        try{ chart.applyOptions({width:el.clientWidth,height:el.clientHeight}); }catch(e){}
        resizeVPCanvas();
        if(STATE.vpEnabled) scheduleVPRedraw();
      }
    },150);
  }
});
window.addEventListener('resize',()=>{
  setTimeout(()=>{
    const el=document.getElementById('chart');
    if(chart && el && el.clientWidth && el.clientHeight){
      try{ chart.applyOptions({width:el.clientWidth,height:el.clientHeight}); }catch(e){}
      resizeVPCanvas();
      if(STATE.vpEnabled) scheduleVPRedraw();
    }
  },150);
});
</script>
