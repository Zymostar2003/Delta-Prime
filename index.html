<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Prime | Multi-User Terminal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root { --bg-dark: #05080a; --nav-blue: #0d121f; --accent-gold: #ffc107; --glass: rgba(255, 255, 255, 0.05); }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: white; }
    .top-nav { background: var(--nav-blue); height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .balance-box { background: #1a2235; padding: 5px 15px; border-radius: 20px; border: 1px solid var(--accent-gold); font-weight: bold; }
    .container { padding: 40px 20px; max-width: 800px; margin: 0 auto; text-align: center; }
    .hero-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; }
    .btn { background: var(--accent-gold); color: black; border: none; padding: 15px 35px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; text-decoration: none; display: inline-block; }
    #chat-window { display: none; position: fixed; bottom: 90px; right: 20px; width: 350px; height: 450px; background: #0d121f; border: 1px solid var(--accent-gold); border-radius: 15px; flex-direction: column; z-index: 1000; }
    #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px; border-radius: 10px; font-size: 0.9rem; max-width: 80%; }
    .bot { background: rgba(255,255,255,0.1); align-self: flex-start; }
    .user { background: var(--accent-gold); color: black; align-self: flex-end; }
    #chat-trigger { position: fixed; bottom: 20px; right: 20px; background: var(--accent-gold); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0d121f; font-size: 1.5rem; }
    .manual-input { margin-top: 30px; padding: 20px; border-top: 1px dashed #444; font-size: 0.8rem; color: #888; }
    input { background: #111; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <nav class="top-nav">
    <div style="font-weight: bold;">DELTA<span style="color:var(--accent-gold)">PRIME</span></div>
    <div class="balance-box" id="balance-display">--- USD</div>
  </nav>

  <div class="container">
    <div class="hero-card">
      <h1 id="welcome-text">Terminal Status: Offline</h1>
      <p id="status-text">Log in to your Deriv account to enable the AI Chat.</p>
      
      <button id="login-btn" class="btn" onclick="redirectToDeriv()">Login with Deriv</button>
      <button id="logout-btn" class="btn" style="display:none; background:#ff4444; color:white;" onclick="logout()">Logout</button>

      <div class="manual-input" id="manual-area">
        <p>If redirect fails, paste your 'token1' from the URL here:</p>
        <input type="text" id="manual-token" placeholder="Paste token here...">
        <button onclick="manualLogin()" style="background:#444; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Connect</button>
      </div>
    </div>
  </div>

  <div id="chat-trigger" onclick="toggleChat()"><i class="fas fa-comment-dots"></i></div>

  <div id="chat-window">
    <div style="padding:15px; border-bottom:1px solid var(--accent-gold); font-weight:bold;">AI Strategy Bot</div>
    <div id="chat-messages"><div class="msg bot">Awaiting authentication...</div></div>
    <div style="padding:15px; display:flex; gap:5px;">
      <input type="text" id="chat-input" placeholder="Type strategy..." style="flex:1;">
      <button onclick="sendMessage()" style="background:var(--accent-gold); border:none; padding:5px 10px; border-radius:5px;">Send</button>
    </div>
  </div>

  <script>
    const APP_ID = '129987';
    let socket;

    function redirectToDeriv() {
      // Direct Link to OAuth
      window.location.href = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN`;
    }

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token1');
      if (token) {
        startSession(token);
      }
    };

    function manualLogin() {
      const token = document.getElementById('manual-token').value.trim();
      if(token) startSession(token);
    }

    function startSession(token) {
      socket = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
      socket.onopen = () => socket.send(JSON.stringify({ authorize: token }));
      socket.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.msg_type === 'authorize' && !data.error) {
          document.getElementById('login-btn').style.display = 'none';
          document.getElementById('manual-area').style.display = 'none';
          document.getElementById('logout-btn').style.display = 'inline-block';
          document.getElementById('welcome-text').innerText = "Terminal Online";
          document.getElementById('status-text').innerText = "Connected as: " + data.authorize.loginid;
          socket.send(JSON.stringify({ balance: 1, subscribe: 1 }));
          addMessage("<b>Authenticated!</b> You can now use the Strategy AI.", 'bot');
        }
        if (data.balance) {
          document.getElementById('balance-display').innerText = `${data.balance.balance} ${data.balance.currency}`;
        }
      };
    }

    function logout() { window.location.href = window.location.origin + window.location.pathname; }
    function toggleChat() { const win = document.getElementById('chat-window'); win.style.display = (win.style.display === 'flex') ? 'none' : 'flex'; }
    function addMessage(text, type) {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div class="msg ${type}">${text}</div>`;
      box.scrollTop = box.scrollHeight;
    }
    function sendMessage() {
      const input = document.getElementById('chat-input');
      if(input.value) { addMessage(input.value, 'user'); input.value = ''; }
    }
  </script>
</body>
</html>
