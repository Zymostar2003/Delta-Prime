<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Prime | Integrated Terminal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root { --bg: #05080a; --nav: #0d121f; --gold: #ffc107; --glass: rgba(255, 255, 255, 0.05); }
    body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    
    /* Navigation Bar */
    .nav { background: var(--nav); height: 65px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 1000; position: relative; }
    .brand { font-weight: bold; font-size: 1.2rem; letter-spacing: 1px; }
    
    .nav-links { display: flex; gap: 25px; }
    .nav-item { cursor: pointer; text-align: center; color: #888; transition: 0.3s; font-size: 0.7rem; text-transform: uppercase; }
    .nav-item.active { color: var(--gold); }
    .nav-item i { display: block; font-size: 1.3rem; margin-bottom: 3px; }

    .balance-box { background: #1a2235; padding: 5px 15px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; min-width: 80px; text-align: center; }

    /* Content Area */
    #view-container { height: calc(100vh - 65px); width: 100%; position: relative; }

    /* AI Section */
    #ai-view { display: flex; flex-direction: column; height: 100%; padding: 20px; box-sizing: border-box; }
    .auth-card { background: var(--glass); padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); text-align: center; margin-bottom: 20px; }
    
    .chat-display { flex: 1; background: #0d121f; border: 1px solid var(--gold); border-radius: 15px; display: none; flex-direction: column; overflow: hidden; }
    .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 15px; border-radius: 10px; font-size: 0.9rem; max-width: 80%; line-height: 1.4; }
    .bot { background: rgba(255,255,255,0.1); align-self: flex-start; }
    .user { background: var(--gold); color: black; align-self: flex-end; font-weight: 500; }

    .input-row { padding: 15px; background: rgba(0,0,0,0.3); display: flex; gap: 10px; border-top: 1px solid #333; }
    input { flex: 1; background: #1a2235; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; outline: none; }
    .send-btn { background: var(--gold); border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; color: black; }

    /* Embedded Bot Builder */
    #dbot-frame { width: 100%; height: 100%; border: none; display: none; background: white; }

    .btn-gold { background: var(--gold); color: black; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="brand">DELTA<span style="color:var(--gold)">PRIME</span></div>
    
    <div class="nav-links">
      <div class="nav-item active" id="btn-ai" onclick="switchTab('ai')">
        <i class="fas fa-brain"></i><span>AI Chat</span>
      </div>
      <div class="nav-item" id="btn-dbot" onclick="switchTab('dbot')">
        <i class="fas fa-robot"></i><span>Bot Builder</span>
      </div>
    </div>

    <div class="balance-box" id="user-balance">0.00 USD</div>
  </nav>

  <div id="view-container">
    <div id="ai-view">
      <div class="auth-card" id="login-prompt">
        <h2>Terminal Offline</h2>
        <p style="color:#aaa; margin-bottom: 20px;">Authorize your account to enable Smart Analysis.</p>
        <button class="btn-gold" onclick="login()">Login with Deriv</button>
      </div>

      <div class="chat-display" id="chat-main">
        <div style="padding:10px; background:rgba(255,255,255,0.03); font-size:0.8rem; font-weight:bold; border-bottom:1px solid #333;">AI STRATEGY SYSTEM</div>
        <div class="messages" id="msg-box"></div>
        <div class="input-row">
          <input type="text" id="user-input" placeholder="Enter strategy logic...">
          <button class="send-btn" onclick="handleSend()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <iframe id="dbot-frame" src="about:blank"></iframe>
  </div>

  <script>
    const APP_ID = '129987';
    let socket;

    function login() {
      window.location.href = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN`;
    }

    function switchTab(tab) {
      const ai = document.getElementById('ai-view');
      const dbot = document.getElementById('dbot-frame');
      const btnAi = document.getElementById('btn-ai');
      const btnDbot = document.getElementById('btn-dbot');

      if (tab === 'dbot') {
        ai.style.display = 'none';
        dbot.style.display = 'block';
        btnAi.classList.remove('active');
        btnDbot.classList.add('active');
        if (dbot.src === "about:blank") dbot.src = "https://dbot.deriv.com";
      } else {
        ai.style.display = 'flex';
        dbot.style.display = 'none';
        btnAi.classList.add('active');
        btnDbot.classList.remove('active');
      }
    }

    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token1');
      if (token) {
        initSession(token);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    };

    function initSession(token) {
      socket = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
      socket.onopen = () => socket.send(JSON.stringify({ authorize: token }));
      socket.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.msg_type === 'authorize' && !data.error) {
          document.getElementById('login-prompt').style.display = 'none';
          document.getElementById('chat-main').style.display = 'flex';
          addMsg("<b>Connected.</b> Your account is linked. Use the tabs above to switch between AI and DBot.", "bot");
          socket.send(JSON.stringify({ balance: 1, subscribe: 1 }));
        }
        if (data.balance) {
          document.getElementById('user-balance').innerText = data.balance.balance + " " + data.balance.currency;
        }
      };
    }

    function addMsg(text, type) {
      const box = document.getElementById('msg-box');
      box.innerHTML += `<div class="msg ${type}">${text}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function handleSend() {
      const input = document.getElementById('user-input');
      if (input.value) {
        addMsg(input.value, "user");
        input.value = "";
        setTimeout(() => addMsg("Analyzing patterns for signals...", "bot"), 700);
      }
    }
  </script>
</body>
</html>
