<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delta Prime | Unified Trading Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #05080a; --nav: #0d121f; --gold: #ffc107; --card: #161b22; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* Navigation */
        .header { background: var(--nav); height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #333; position: relative; z-index: 10; }
        .tabs { display: flex; gap: 15px; }
        .tab-btn { cursor: pointer; text-align: center; color: #888; font-size: 0.65rem; text-transform: uppercase; font-weight: bold; }
        .tab-btn.active { color: var(--gold); }
        .tab-btn i { display: block; font-size: 1.4rem; margin-bottom: 3px; }

        .balance-box { background: #1a2235; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; }

        /* Viewport Management */
        .content-area { height: calc(100vh - 70px); width: 100%; position: relative; overflow-y: auto; }
        .view { display: none; height: 100%; width: 100%; }
        .view.active { display: block; }

        /* Free Bots Grid */
        .bot-grid { padding: 20px; display: grid; gap: 15px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        .bot-card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 20px; text-align: center; }
        .bot-card h3 { margin: 0 0 10px 0; color: var(--gold); }
        .load-btn { background: #1a2b4c; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* Iframe for DBot */
        iframe { width: 100%; height: 100%; border: none; background: white; }

        /* AI Chat UI */
        #ai-chat-view { display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .chat-box { flex: 1; background: #0d121f; border: 1px solid #333; border-radius: 12px; margin-bottom: 10px; padding: 15px; overflow-y: auto; }
    </style>
</head>
<body>

<header class="header">
    <div style="font-weight:bold;">DELTA<span style="color:var(--gold)">PRIME</span></div>
    <div class="tabs">
        <div class="tab-btn active" onclick="switchTab('free')"><i class="fas fa-robot"></i>Free Bots</div>
        <div class="tab-btn" onclick="switchTab('builder')"><i class="fas fa-tools"></i>Builder</div>
        <div class="tab-btn" onclick="switchTab('ai')"><i class="fas fa-brain"></i>AI Chat</div>
    </div>
    <div class="balance-box" id="user-bal">0.00 USD</div>
</header>

<div class="content-area">
    <!-- View 1: Free Bots (Exactly like ikiihub.site) -->
    <div id="view-free" class="view active">
        <div class="bot-grid">
            <div class="bot-card">
                <h3>AUTO DREAM V5 [BY PK] 💵</h3>
                <p style="font-size:0.8rem; color:#aaa;">Automate your trades with our freebots</p>
                <button class="load-btn" onclick="downloadBot('https://github.com/deriv-bots/Deriv-Bot-XML/raw/main/AUTO%20DREAM%20V5.xml')">Load Bot</button>
            </div>
            <div class="bot-card">
                <h3>Auto C4 Volt</h3>
                <p style="font-size:0.8rem; color:#aaa;">High performance volatility strategy</p>
                <button class="load-btn" onclick="downloadBot('https://github.com/mthadian/derivbots/raw/master/Auto%20C4%20Volt.xml')">Load Bot</button>
            </div>
            <div class="bot-card">
                <h3>Candle Mine V2</h3>
                <p style="font-size:0.8rem; color:#aaa;">Trend-based mining automation</p>
                <button class="load-btn" onclick="downloadBot('https://github.com/deriv-bots/derivrobots/raw/main/Candle%20Mine%20V2.xml')">Load Bot</button>
            </div>
        </div>
    </div>

    <!-- View 2: Official Bot Builder (Embedded) -->
    <div id="view-builder" class="view">
        <iframe id="dbot-frame" src="about:blank"></iframe>
    </div>

    <!-- View 3: AI Chat -->
    <div id="view-ai" class="view">
        <div id="ai-chat-view">
            <div class="chat-box" id="chat-content">
                <div style="color:var(--gold)">[System]: Ready for strategy analysis.</div>
            </div>
            <input type="text" placeholder="Type strategy..." style="padding:15px; background:#1a2235; border:1px solid #333; color:white; border-radius:8px;">
        </div>
    </div>
</div>

<script>
    const APP_ID = '129987';
    let userToken = new URLSearchParams(window.location.search).get('token1');

    function switchTab(target) {
        // Update Buttons
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');

        // Update Views
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(`view-${target}`).classList.add('active');

        // Handle Iframe Loading with Token Sync
        if(target === 'builder') {
            const frame = document.getElementById('dbot-frame');
            const targetUrl = userToken 
                ? `https://dbot.deriv.com?token1=${userToken}&app_id=${APP_ID}` 
                : `https://dbot.deriv.com?app_id=${APP_ID}`;
            
            if(frame.src !== targetUrl) frame.src = targetUrl;
        }
    }

    function downloadBot(xmlUrl) {
        const link = document.createElement('a');
        link.href = xmlUrl;
        link.download = 'DeltaPrime_Bot.xml';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // After download, prompt user to go to Builder
        alert("Bot XML Downloaded! Now switch to the 'Builder' tab and click 'Local' to import it.");
        switchTab('builder');
    }

    // Auto-login logic if token exists
    if(userToken) {
        const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
        ws.onopen = () => ws.send(JSON.stringify({ authorize: userToken }));
        ws.onmessage = (msg) => {
            const res = JSON.parse(msg.data);
            if(res.balance) document.getElementById('user-bal').innerText = `${res.balance.balance} ${res.balance.currency}`;
        };
    }
</script>
</body>
</html>
