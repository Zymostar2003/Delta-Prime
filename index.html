<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Prime | Terminal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root { --bg: #05080a; --nav: #0d121f; --gold: #ffc107; --glass: rgba(255, 255, 255, 0.05); }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; }
    
    /* Navigation with your Bot Builder Icon */
    .nav { background: var(--nav); height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); sticky: top; }
    .nav-brand { font-weight: bold; font-size: 1.2rem; }
    
    .bot-link { cursor: pointer; text-align: center; color: var(--gold); transition: 0.3s; }
    .bot-link:hover { opacity: 0.8; }
    .bot-link i { font-size: 1.5rem; display: block; }
    .bot-link span { font-size: 0.7rem; text-transform: uppercase; margin-top: 3px; display: block; }

    .balance { background: #1a2235; padding: 5px 15px; border-radius: 20px; border: 1px solid var(--gold); font-weight: bold; color: var(--gold); }

    .container { padding: 15px; max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    /* Terminal Card */
    .card { background: var(--glass); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
    
    /* AI Strategy Chat */
    #chat-area { background: #0d121f; border: 1px solid var(--gold); border-radius: 15px; display: none; flex-direction: column; height: 450px; }
    #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 12px; border-radius: 10px; font-size: 0.9rem; max-width: 85%; }
    .bot { background: rgba(255,255,255,0.08); align-self: flex-start; }
    .user { background: var(--gold); color: black; align-self: flex-end; font-weight: 500; }

    .input-row { padding: 12px; display: flex; gap: 8px; background: rgba(0,0,0,0.3); border-top: 1px solid #333; }
    input { flex: 1; background: #1a2235; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; outline: none; }
    .send-btn { background: var(--gold); border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; color: black; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-brand">DELTA<span style="color:var(--gold)">PRIME</span></div>
    
    <div class="bot-link" onclick="openBotBuilder()">
      <i class="fas fa-robot"></i>
      <span>Bot Builder</span>
    </div>

    <div class="balance" id="wallet">0.00 USD</div>
  </nav>

  <div class="container">
    <div class="card" id="login-card">
      <h2 id="main-status">Terminal Offline</h2>
      <button onclick="login()" style="background:var(--gold); border:none; padding:12px 25px; border-radius:8px; font-weight:bold; cursor:pointer;">Login with Deriv</button>
    </div>

    <div id="chat-area">
      <div style="padding:12px; font-weight:bold; border-bottom:1px solid #333; font-size:0.8rem;">STRATEGY ANALYZER</div>
      <div id="messages"></div>
      <div class="input-row">
        <input type="text" id="user-txt" placeholder="Enter logic (e.g. 5 evens)...">
        <button class="send-btn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    const APP_ID = '129987';
    let socket;

    // YOUR REQUESTED FUNCTION
    function openBotBuilder() {
      // Opens official DBot in a new tab
      window.open('https://dbot.deriv.com', '_blank');
    }

    function login() {
      window.location.href = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN`;
    }

    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token1');
      if (token) {
        connect(token);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    };

    function connect(token) {
      socket = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
      socket.onopen = () => socket.send(JSON.stringify({ authorize: token }));
      socket.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.msg_type === 'authorize' && !data.error) {
          document.getElementById('login-card').style.display = 'none';
          document.getElementById('chat-area').style.display = 'flex';
          addMsg("<b>Terminal Authenticated.</b> Use the Bot Builder icon above for official DBots, or type here for AI Analysis.", "bot");
          socket.send(JSON.stringify({ balance: 1, subscribe: 1 }));
        }
        if (data.balance) document.getElementById('wallet').innerText = data.balance.balance + " " + data.balance.currency;
      };
    }

    function addMsg(t, c) {
      const b = document.getElementById('messages');
      b.innerHTML += `<div class="msg ${c}">${t}</div>`;
      b.scrollTop = b.scrollHeight;
    }

    function sendMsg() {
      const i = document.getElementById('user-txt');
      if(i.value) { 
        addMsg(i.value, "user"); 
        i.value = ""; 
        setTimeout(() => addMsg("Processing strategy pattern...", "bot"), 600);
      }
    }
  </script>
</body>
</html>
