<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Prime | Terminal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root { --bg: #05080a; --nav: #0d121f; --gold: #ffc107; }
    body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
    
    .nav { background: var(--nav); height: 65px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #222; }
    .nav-item { cursor: pointer; color: #666; font-size: 0.7rem; text-align: center; }
    .nav-item.active { color: var(--gold); }
    .nav-item i { display: block; font-size: 1.2rem; margin-bottom: 2px; }

    #view-port { height: calc(100vh - 65px); width: 100%; position: relative; }
    iframe { width: 100%; height: 100%; border: none; display: none; background: white; }
    
    #ai-view { display: flex; flex-direction: column; height: 100%; padding: 20px; box-sizing: border-box; text-align: center; }
    .login-card { background: rgba(255,255,255,0.03); padding: 30px; border-radius: 15px; border: 1px solid #333; }
    
    .chat-box { flex: 1; background: #0d121f; border: 1px solid var(--gold); border-radius: 10px; display: none; flex-direction: column; overflow: hidden; margin-top: 10px; }
    #msgs { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; max-width: 80%; }
    .bot { background: #222; align-self: flex-start; }
    .user { background: var(--gold); color: black; align-self: flex-end; }

    .btn-gold { background: var(--gold); color: black; border: none; padding: 12px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <nav class="nav">
    <div style="font-weight:bold;">DELTA<span style="color:var(--gold)">PRIME</span></div>
    <div style="display:flex; gap:20px;">
      <div class="nav-item active" id="t-ai" onclick="tab('ai')"><i class="fas fa-brain"></i>AI CHAT</div>
      <div class="nav-item" id="t-bot" onclick="tab('bot')"><i class="fas fa-robot"></i>BOT BUILDER</div>
    </div>
    <div id="balance" style="color:var(--gold); font-weight:bold;">0.00</div>
  </nav>

  <div id="view-port">
    <div id="ai-view">
      <div id="auth-gate" class="login-card">
        <h3>Authentication Required</h3>
        <button class="btn-gold" onclick="doLogin()">Connect Deriv Account</button>
      </div>

      <div id="chat-ui" class="chat-box">
        <div id="msgs"></div>
        <div style="padding:10px; background:#05080a; display:flex; gap:5px;">
          <input type="text" id="in" placeholder="Strategy..." style="flex:1; padding:10px; background:#1a2235; border:1px solid #333; color:white;">
          <button onclick="send()" style="background:var(--gold); border:none; padding:10px;">Send</button>
        </div>
      </div>
    </div>
    
    <iframe id="bot-frame" src="about:blank"></iframe>
  </div>

  <script>
    const APP_ID = '129987';
    let myToken = localStorage.getItem('dt_token') || '';

    function doLogin() {
      window.location.href = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN`;
    }

    function tab(name) {
      const ai = document.getElementById('ai-view');
      const bot = document.getElementById('bot-frame');
      
      document.getElementById('t-ai').className = name === 'ai' ? 'nav-item active' : 'nav-item';
      document.getElementById('t-bot').className = name === 'bot' ? 'nav-item active' : 'nav-item';

      if(name === 'bot') {
        ai.style.display = 'none';
        bot.style.display = 'block';
        // Force the token into the frame URL every time you switch
        if(myToken) {
          bot.src = `https://dbot.deriv.com?token1=${myToken}`;
        } else {
          bot.src = "https://dbot.deriv.com";
        }
      } else {
        ai.style.display = 'flex';
        bot.style.display = 'none';
      }
    }

    window.onload = function() {
      const p = new URLSearchParams(window.location.search);
      const t = p.get('token1');
      
      if(t) {
        myToken = t;
        localStorage.setItem('dt_token', t);
        window.history.replaceState({}, '', window.location.pathname);
      }

      if(myToken) {
        startSync(myToken);
      }
    };

    function startSync(token) {
      const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
      ws.onopen = () => ws.send(JSON.stringify({ authorize: token }));
      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if(d.msg_type === 'authorize' && !d.error) {
          document.getElementById('auth-gate').style.display = 'none';
          document.getElementById('chat-ui').style.display = 'flex';
          ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
          add("<b>System Online.</b> Session token shared with Bot Builder.", "bot");
        }
        if(d.balance) document.getElementById('balance').innerText = d.balance.balance + " " + d.balance.currency;
      };
    }

    function add(t, c) {
      const m = document.getElementById('msgs');
      m.innerHTML += `<div class="msg ${c}">${t}</div>`;
      m.scrollTop = m.scrollHeight;
    }

    function send() {
      const i = document.getElementById('in');
      if(i.value) { add(i.value, "user"); i.value = ''; }
    }
  </script>
</body>
</html>
