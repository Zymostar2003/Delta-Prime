<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CEOSKIT | Pro Trader Elite</title>
    <style>
        :root {
            --bg-white: #ffffff;
            --panel-bg: #f8f9fa;
            --accent: #3f51b5; 
            --green: #00c853; 
            --orange: #ff9100; 
            --red: #ff5252;    
            --border: #dee2e6;
            --dark-gray: #444;
            --deep-black: #000000;
            --text-main: #1a1a1a;
            --surface: #f5f5f5;
            --seq-1: #673ab7; 
            --seq-2: #009688;
            --card-bg: #ffffff;
            --select-bg: #ffffff;
        }

        /* COMPLETELY BLACK DARK MODE */
        [data-theme="dark"] {
            --bg-white: #000000;
            --panel-bg: #0a0a0a;
            --border: #222222;
            --deep-black: #ffffff;
            --text-main: #e0e0e0;
            --surface: #050505;
            --accent: #5c6bc0;
            --card-bg: #0d0d0d;
            --select-bg: #111111;
            --green: #00e676;
            --orange: #ffab40;
            --red: #ff5252;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-white); color: var(--text-main); margin: 0; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-in-out;
        }
        #money-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #decrypt-container {
            font-family: monospace;
            font-size: 2.2rem;
            font-weight: 900;
            color: #00ff41;
            z-index: 10001;
            text-shadow: 0 0 10px rgba(0,255,65,0.5);
            background: rgba(0,0,0,0.7);
            padding: 20px 40px;
            border-radius: 20px;
            letter-spacing: 2px;
        }
        .splash-red {
            color: #ff3b30;
            text-shadow: 0 0 10px rgba(255,59,48,0.5);
        }

        /* HEADER with HAMBURGER MENU */
        .main-header {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }
        .hamburger {
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .hamburger:hover {
            background: var(--panel-bg);
        }
        .brand {
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .brand span {
            color: var(--accent);
        }

        /* SIDE MENU */
        .side-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 280px;
            height: 100%;
            background: var(--bg-white);
            z-index: 20000;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 0 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        .side-menu.open {
            left: 0;
        }
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 19999;
            display: none;
            backdrop-filter: blur(3px);
        }
        .menu-header {
            padding: 25px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--text-main);
        }
        .menu-header span {
            color: var(--accent);
        }
        .menu-item {
            padding: 18px 20px;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: background 0.2s;
            color: var(--text-main);
        }
        .menu-item:hover {
            background: var(--panel-bg);
        }
        .theme-toggle-item {
            justify-content: space-between;
        }
        .theme-switch {
            width: 52px;
            height: 28px;
            background: var(--border);
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        .theme-switch.active {
            background: var(--accent);
        }
        .theme-switch .slider {
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: transform 0.3s;
        }
        .theme-switch.active .slider {
            transform: translateX(24px);
        }
        .social-footer {
            margin-top: auto;
            padding: 25px 20px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border);
        }
        .social-icon {
            width: 48px;
            height: 48px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--surface);
        }
        .social-icon:hover {
            transform: scale(1.08);
        }
        .social-icon svg {
            width: 28px;
            height: 28px;
        }
        .wa-icon svg { fill: #25D366; }
        .gm-icon svg { fill: #EA4335; }
        .tt-icon svg { fill: #000000; }
        [data-theme="dark"] .tt-icon svg { fill: #ffffff; }

        /* CHART MODAL - Height: 600px, Close button small and positioned higher */
        .chart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 15000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        .chart-modal-content {
            width: 95%;
            max-width: 1200px;
            height: 600px;
            background: #131722;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .chart-modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Small close button, positioned higher (top: 8px, right: 8px) */
        .close-chart {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            background: rgba(0,0,0,0.65);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 16px;
            font-weight: bold;
            z-index: 15001;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .close-chart:hover {
            background: rgba(255,59,48,0.9);
            transform: scale(1.05);
        }

        /* REST OF ORIGINAL STYLES */
        .icon-toolbar { display: flex; gap: 15px; padding: 10px 20px; background: var(--bg-white); border-bottom: 1px solid var(--border); align-items: center; }
        .tool-btn { padding: 8px 15px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 5px; text-transform: uppercase; color: var(--text-main); }

        .nav-bar { display: flex; background: var(--bg-white); overflow-x: auto; border-bottom: 1px solid var(--border); }
        .nav-item { padding: 15px 18px; font-size: 12px; font-weight: 900; cursor: pointer; color: var(--text-main); white-space: nowrap; text-transform: uppercase; border-bottom: 3px solid transparent; }
        .nav-item.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--panel-bg); }

        .market-shield { margin: 15px 10px; padding: 15px; border: 2px solid var(--border); border-radius: 12px; position: relative; background: var(--bg-white); }
        .shield-label { position: absolute; top: -10px; left: 15px; background: var(--bg-white); padding: 0 8px; font-size: 10px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

        #contract-nav { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--surface); padding: 8px; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        .sub-nav-item { padding: 12px; font-size: 12px; font-weight: 900; cursor: pointer; color: var(--text-main); text-transform: uppercase; background: var(--bg-white); border: 2px solid var(--border); border-radius: 8px; text-align: center; }
        .sub-nav-item.active { color: var(--accent); border-color: var(--accent); background: var(--panel-bg); }

        main { flex: 1; padding: 0 10px; display: flex; flex-direction: column; }
        #live-price { font-size: 3.5rem; font-weight: 800; text-align: center; margin: 20px 0; color: var(--text-main); }

        #digit-panel { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px 8px; padding: 35px 15px 15px 15px; background: var(--panel-bg); border-radius: 18px; border: 1px solid var(--border); margin-bottom: 25px; }
        #digit-cursor { position: absolute; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 15px solid var(--accent); transition: all 0.2s; z-index: 99; pointer-events: none; }
        
        .digit-group { display: flex; flex-direction: column; align-items: center; }
        .digit-circle { width: 42px; height: 42px; border-radius: 50%; background: var(--card-bg); display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 4px; border: 1px solid var(--border); color: var(--text-main); }
        .rank-1 .digit-circle { background: var(--green); color: white; }
        .rank-2 .digit-circle { background: var(--orange); color: white; }
        .rank-last .digit-circle { background: var(--red); color: white; }
        .pct-label { color: var(--text-main); }

        .barrier-filter-panel { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; margin-bottom: 15px; }
        .barrier-btn { padding: 10px 0; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 900; color: var(--text-main); text-align: center; }
        .barrier-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-reset { background: #fee2e2; color: #dc2626; border-color: #fecaca; }

        .window-container { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 30px; }
        .window-stats-header { display: flex; justify-content: space-around; margin-bottom: 12px; font-weight: 900; font-size: 13px; text-transform: uppercase; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        #rolling-window { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
        .roll-node { aspect-ratio: 1/1; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; color: white; }
        
        .node-neutral { background: var(--dark-gray); }
        .node-green { background: var(--green); }
        .node-red { background: var(--red); }
        
        .node-repeat-A { background: var(--seq-1) !important; border: 2px solid rgba(255,255,255,0.5); }
        .node-repeat-B { background: var(--seq-2) !important; border: 2px solid rgba(255,255,255,0.5); }

        .hidden { display: none !important; }
        
        .main-content {
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .main-content.visible {
            opacity: 1;
        }

        select {
            background: var(--select-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            font-weight: 900;
            width: 100%;
        }
        option {
            background: var(--select-bg);
            color: var(--text-main);
        }
    </style>
</head>

    <script>
        // ========== CHART MODAL (Height 600px, small close button) ==========
        const chartModal = document.getElementById('chart-modal');
        const toggleChartBtn = document.getElementById('toggle-chart');
        const chartTextSpan = document.getElementById('chart-text');
        
        function openChartModal() {
            chartModal.style.display = 'flex';
            chartTextSpan.innerText = 'Close Chart';
        }
        
        function closeChartModal() {
            chartModal.style.display = 'none';
            chartTextSpan.innerText = 'Analyze Chart';
        }
        
        toggleChartBtn.onclick = () => {
            if (chartModal.style.display === 'flex') {
                closeChartModal();
            } else {
                openChartModal();
            }
        };
        
        // Close modal when clicking outside content
        chartModal.onclick = (e) => {
            if (e.target === chartModal) {
                closeChartModal();
            }
        };
        
        // ========== HAMBURGER MENU LOGIC ==========
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const sideMenu = document.getElementById('side-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        
        function openMenu() {
            sideMenu.classList.add('open');
            menuOverlay.style.display = 'block';
        }
        function closeMenu() {
            sideMenu.classList.remove('open');
            menuOverlay.style.display = 'none';
        }
        hamburgerBtn.onclick = (e) => {
            e.stopPropagation();
            if (sideMenu.classList.contains('open')) closeMenu();
            else openMenu();
        };
        
        // ========== THEME TOGGLE (Completely Black Dark Mode) ==========
        function initTheme() {
            const savedTheme = localStorage.getItem('ceoskit_theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-switch').classList.add('active');
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('theme-switch').classList.remove('active');
            }
        }
        
        function toggleThemeMode(event) {
            event.stopPropagation();
            const switchEl = document.getElementById('theme-switch');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('ceoskit_theme', 'light');
                switchEl.classList.remove('active');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('ceoskit_theme', 'dark');
                switchEl.classList.add('active');
            }
            setTimeout(() => {
                if (fullHistory.length) moveCursor(fullHistory[fullHistory.length-1].digit);
            }, 50);
        }
        
        // ========== SPLASH SCREEN ==========
        (function initSplash() {
            const canvas = document.getElementById('money-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];
            
            function resize() { 
                width = canvas.width = window.innerWidth; 
                height = canvas.height = window.innerHeight; 
            }
            window.addEventListener('resize', resize);
            resize();
            
            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * -height;
                    this.size = 25 + Math.random() * 45;
                    this.speed = 1.5 + Math.random() * 3.5;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                    this.opacity = 0.15 + Math.random() * 0.35;
                }
                update() { 
                    this.y += this.speed; 
                    this.rotation += this.rotationSpeed; 
                    if (this.y > height + 50) this.reset(); 
                }
                draw() {
                    ctx.save(); 
                    ctx.translate(this.x, this.y); 
                    ctx.rotate(this.rotation);
                    ctx.font = `${this.size}px Arial`; 
                    ctx.fillStyle = `rgba(0, 255, 65, ${this.opacity})`;
                    ctx.fillText('$', 0, 0); 
                    ctx.restore();
                }
            }
            
            for (let i = 0; i < 55; i++) particles.push(new Particle());
            
            function animate() { 
                ctx.clearRect(0, 0, width, height); 
                particles.forEach(p => { p.update(); p.draw(); }); 
                requestAnimationFrame(animate); 
            }
            animate();
            
            const targetText = "CEOSkitTheTrader";
            const cont = document.getElementById('decrypt-container');
            let revealedCount = 0;
            let interval = setInterval(() => {
                let html = "";
                for (let i = 0; i < targetText.length; i++) {
                    if (i < revealedCount) {
                        const letter = targetText[i];
                        if (i < 3) {
                            html += `<span class="splash-red">${letter}</span>`;
                        } else {
                            html += letter;
                        }
                    } else {
                        const randChars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$@%";
                        const randomChar = randChars[Math.floor(Math.random() * randChars.length)];
                        html += randomChar;
                    }
                }
                cont.innerHTML = html;
                revealedCount++;
                if (revealedCount >= targetText.length) {
                    clearInterval(interval);
                    let finalHtml = "";
                    for (let i = 0; i < targetText.length; i++) {
                        if (i < 3) {
                            finalHtml += `<span class="splash-red">${targetText[i]}</span>`;
                        } else {
                            finalHtml += targetText[i];
                        }
                    }
                    cont.innerHTML = finalHtml;
                    setTimeout(() => {
                        const splash = document.getElementById('splash-screen');
                        splash.style.opacity = '0';
                        setTimeout(() => {
                            splash.style.display = 'none';
                            document.getElementById('main-content').classList.add('visible');
                        }, 1000);
                    }, 2000);
                }
            }, 65);
        })();
        
        // ========== ORIGINAL TRADING APP CODE ==========
        const APP_ID = 1089;
        let socket, masterSymbols = [], fullHistory = [], activeCat = 'volatility', activeType = 'rise_fall', activeBarrier = null;
        const priceEl = document.getElementById('live-price'), rollEl = document.getElementById('rolling-window'), 
              digitPanel = document.getElementById('digit-panel'), barrierPanel = document.getElementById('barrier-panel'),
              analysisTools = document.getElementById('analysis-tools'), contractNav = document.getElementById('contract-nav');

        function setupDigitGrid() {
            digitPanel.innerHTML = '<div id="digit-cursor" class="hidden"></div>';
            barrierPanel.innerHTML = '';
            for(let i=0; i<=9; i++) {
                const g = document.createElement('div'); g.className = 'digit-group'; g.id = `group-${i}`;
                g.innerHTML = `<div class="digit-circle">${i}</div><span class="pct-label" style="font-weight:900">0%</span>`;
                digitPanel.appendChild(g);
                const b = document.createElement('div');
                b.className = `barrier-btn`; b.innerText = i;
                b.onclick = () => {
                    document.querySelectorAll('.barrier-btn').forEach(btn => btn.classList.remove('active'));
                    b.classList.add('active'); activeBarrier = i; updateStats();
                };
                barrierPanel.appendChild(b);
            }
            const r = document.createElement('div');
            r.className = 'barrier-btn btn-reset'; r.innerText = 'X';
            r.onclick = () => {
                document.querySelectorAll('.barrier-btn').forEach(btn => btn.classList.remove('active'));
                activeBarrier = null; updateStats();
            };
            barrierPanel.appendChild(r);
        }

        function moveCursor(digit) {
            const targetGroup = document.getElementById(`group-${digit}`);
            const cursorObj = document.getElementById('digit-cursor');
            if(!targetGroup || !cursorObj || analysisTools.classList.contains('hidden')) return;
            cursorObj.classList.remove('hidden');
            cursorObj.style.left = (targetGroup.offsetLeft + (targetGroup.offsetWidth / 2) - 10) + "px";
            cursorObj.style.top = (targetGroup.offsetTop - 15) + "px";
        }

        function connect() {
            socket = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
            socket.onopen = () => socket.send(JSON.stringify({ active_symbols: "brief" }));
            socket.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if (data.msg_type === 'active_symbols') { masterSymbols = data.active_symbols; renderList('volatility'); }
                if (data.msg_type === 'history' || data.msg_type === 'tick') {
                    const pips = (data.tick ? data.tick.pip_size : (data.history ? data.pip_size : 2));
                    const prices = data.tick ? [data.tick.quote] : data.history.prices;
                    prices.forEach(p => {
                        const d = parseInt(p.toFixed(pips).slice(-1));
                        const prev = fullHistory.length > 0 ? fullHistory[fullHistory.length-1].price : p;
                        fullHistory.push({ price: p, digit: d, diff: p - prev });
                    });
                    if (fullHistory.length > 1000) fullHistory.splice(0, fullHistory.length - 1000);
                    if (data.tick) {
                        const last = fullHistory[fullHistory.length-1];
                        priceEl.innerHTML = `${last.price.toFixed(pips).slice(0, -1)}<span style="color:var(--accent)">${last.digit}</span>`;
                        moveCursor(last.digit);
                    }
                    updateStats();
                }
            };
        }

        function updateStats() {
            if (fullHistory.length === 0 || analysisTools.classList.contains('hidden')) return;
            const windowData = fullHistory.slice(-50);
            rollEl.innerHTML = '';
            let countPrimary = 0, lastRepeatDigit = null, colorToggle = false;

            const isBarrierMode = (activeType === 'matches_differs' || activeType === 'over_under');
            barrierPanel.classList.toggle('hidden', !isBarrierMode);

            const showRepeats = (activeType === 'matches_differs');
            const repeatStatus = windowData.map((t, i) => {
                if (!showRepeats) return false;
                const isNextSame = (i < windowData.length - 1 && t.digit === windowData[i+1].digit);
                const isPrevSame = (i > 0 && t.digit === windowData[i-1].digit);
                return isNextSame || isPrevSame;
            });

            windowData.forEach((t, i) => {
                const n = document.createElement('div'); n.className = 'roll-node';
                let isMatch = false;

                if (repeatStatus[i]) {
                    if (t.digit !== lastRepeatDigit) { colorToggle = !colorToggle; }
                    n.classList.add(colorToggle ? 'node-repeat-A' : 'node-repeat-B');
                    lastRepeatDigit = t.digit;
                }

                if (activeType === 'matches_differs') {
                    n.innerText = t.digit; isMatch = (activeBarrier !== null && t.digit === activeBarrier);
                } else if (activeType === 'over_under') {
                    n.innerText = t.digit > (activeBarrier ?? 4) ? 'O' : 'U'; isMatch = (t.digit > (activeBarrier ?? 4));
                } else if (activeType === 'even_odd') {
                    n.innerText = t.digit % 2 === 0 ? 'E' : 'O'; isMatch = (t.digit % 2 === 0);
                } else {
                    n.innerText = t.diff >= 0 ? 'R' : 'F'; isMatch = (t.diff >= 0);
                }

                if (!repeatStatus[i]) {
                    if (activeType === 'matches_differs' && activeBarrier === null) n.classList.add('node-neutral');
                    else n.classList.add(isMatch ? 'node-green' : 'node-red');
                }
                if (isMatch) countPrimary++;
                rollEl.appendChild(n);
            });

            const priPct = ((countPrimary / windowData.length) * 100).toFixed(0);
            const secPct = (100 - priPct);

            let labelL = "RISE", labelR = "FALL";
            if (activeType === 'even_odd') { labelL = "EVEN"; labelR = "ODD"; }
            else if (activeType === 'over_under') { labelL = "OVER"; labelR = "UNDER"; }
            else if (activeType === 'matches_differs') { labelL = "MATCH"; labelR = "DIFF"; }

            document.getElementById('stat-left').innerHTML = `${labelL}: <span style="color:var(--deep-black)">${priPct}%</span>`;
            document.getElementById('stat-right').innerHTML = `${labelR}: <span style="color:var(--deep-black)">${secPct}%</span>`;

            const counts = Array(10).fill(0);
            fullHistory.forEach(t => counts[t.digit]++);
            const stats = counts.map((count, digit) => ({ digit, count, pct: ((count / fullHistory.length) * 100).toFixed(1) }));
            const sorted = [...stats].sort((a, b) => b.count - a.count);
            stats.forEach(s => {
                const group = document.getElementById(`group-${s.digit}`);
                if(group) {
                    group.className = 'digit-group';
                    if (s.digit === sorted[0].digit) group.classList.add('rank-1');
                    else if (s.digit === sorted[1].digit) group.classList.add('rank-2');
                    else if (s.digit === sorted[9].digit) group.classList.add('rank-last');
                    group.querySelector('.pct-label').innerText = `${s.pct}%`;
                }
            });
        }

        function renderList(cat) {
            activeCat = cat;
            const isDigitMarket = (cat === 'volatility' || cat === 'jump');
            analysisTools.classList.toggle('hidden', !isDigitMarket);
            contractNav.classList.toggle('hidden', !isDigitMarket);
            
            const filtered = masterSymbols.filter(m => {
                const d = m.display_name.toUpperCase();
                if (cat === 'volatility') return m.symbol.toUpperCase().startsWith('R_') || m.symbol.toUpperCase().startsWith('1HZ');
                if (cat === 'crash_boom') return d.includes('CRASH') || d.includes('BOOM');
                if (cat === 'step') return d.includes('STEP');
                if (cat === 'jump') return d.includes('JUMP');
                return false;
            });

            const select = document.getElementById('market-select');
            select.innerHTML = filtered.map(m => `<option value="${m.symbol}">${m.display_name}</option>`).join('');
            select.onchange = (e) => {
                fullHistory = [];
                socket.send(JSON.stringify({ forget_all: "ticks" }));
                socket.send(JSON.stringify({ ticks_history: e.target.value, count: 1000, end: "latest", style: "ticks" }));
                socket.send(JSON.stringify({ ticks: e.target.value, subscribe: 1 }));
            };
            if (filtered.length > 0) select.dispatchEvent(new Event('change'));
        }

        document.querySelectorAll('.nav-item').forEach(btn => btn.onclick = function() {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            this.classList.add('active'); renderList(this.dataset.cat);
        });

        document.querySelectorAll('.sub-nav-item').forEach(btn => btn.onclick = function() {
            document.querySelectorAll('.sub-nav-item').forEach(i => i.classList.remove('active'));
            this.classList.add('active'); activeType = this.dataset.type; updateStats();
        });

        setupDigitGrid();
        connect();
        initTheme();
    </script>
</body>
</html>
